name: Release

# A tag v<version> publishes the .deb in its release and adds it to
# https://apt.popamp.app; a manual run only builds it (run artifact).
# The work is done by popamp/apt's addon-release workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: popamp/apt/.github/workflows/addon-release.yml@main
    with:
      min-popamp: "0.8.0"   # the clock's `align`
    secrets: inherit
