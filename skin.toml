# Popamp Modern: a test skin with round buttons and rounded windows.
# Own artwork; labels are DejaVu Sans Condensed Bold outlines.

[meta]
name = "Popamp Modern"
author = "Popamp"
format_version = 1
min_popamp = "0.8.0"

