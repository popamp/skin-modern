# Popamp Modern: a test skin with round buttons and rounded windows.
# Own artwork; labels are DejaVu Sans Condensed Bold outlines.

[meta]
name = "Popamp Modern"
author = "Popamp"
format_version = 1
min_popamp = "0.8.0"

[text]
size = 7
color = "#8fd6ff"

[clock]
size = 16
color = "#8fd6ff"

[playlist]
normal = "#9fd8ff"
current = "#ffffff"
normal_bg = "#0d1720"
selected_bg = "#24496f"

[vis]
colors = ["#0a131b", "#1b2a36", "#ffffff", "#e3f2ff", "#c8e4ff", "#acd7ff", "#90caff", "#74bcff", "#59afff", "#3da2ff", "#2d95f6", "#2a88e3", "#267cd0", "#226fbe", "#1f63ab", "#1b5698", "#184a86", "#143d73", "#ffffff", "#c8e8ff", "#8fd6ff", "#4fb0f0", "#2f9bff", "#ffffff"]

# --- main window ---

[[window]]
key = "main"
placement = "free"
empty_press = "move"

[window.normal]
size = [275, 116]
see_through = true

[[window.normal.element]]
